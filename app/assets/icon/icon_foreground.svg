<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The Pill — popředí adaptivní ikony (Android), pozadí #0A120E. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#14251B"/>
      <stop offset="1" stop-color="#05090A"/>
    </radialGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DFF8A" stop-opacity="0"/>
      <stop offset="1" stop-color="#3DFF8A"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
